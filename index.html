<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG first: one file, sharp at every size, and the only one that has to be
      kept in step with the brand. The PNG is generated from it rather than
      drawn separately, so the two cannot drift.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores an SVG touch icon, so the home-screen tile needs a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta
      name="description"
      content="CHULLAN. Crafted for the inherently handsome. Weightless coverage, zero shine, and undeniable South Indian charm."
    />
    <meta property="og:title" content="CHULLAN — Pure. Impact." />
    <meta
      property="og:description"
      content="Crafted for the inherently handsome. Pure South Indian charm."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>CHULLAN — Pure. Impact.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
