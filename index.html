<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      SVG first: one file, sharp at every size, and the only one that has to be
      kept in step with the brand. The PNG is generated from it rather than
      drawn separately, so the two cannot drift.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores an SVG touch icon, so the home-screen tile needs a PNG. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0B" />
    <meta
      name="description"
      content="Professional base makeup formulated in the USA for Indian skin tones. 8 foundation shades, salon-grade primer, anti-shine powder, setting spray, and more. Built for Indian conditions."
    />
    <meta property="og:title" content="Chullan | Professional Makeup for Indian Skin Tones" />
    <meta
      property="og:description"
      content="Professional base makeup formulated in the USA and manufactured in India. 8 products designed specifically for Indian skin tones. Trusted by salon professionals."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://chullancosmetics.com/" />
    <link rel="canonical" href="https://chullancosmetics.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Syne:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Chullan | Professional Makeup for Indian Skin Tones</title>

    <!--
      Organization schema lives in the static HTML rather than being injected by
      the app.

      It is the one graph that has to reach a crawler which does not execute
      JavaScript — the whole point of an entity definition is that it is found —
      and this file is the only thing such a crawler receives. Route-specific
      graphs are set from `useSeo`, with the caveat documented there.

      Entity names are fixed by the content brief and must match everywhere they
      appear: "Chullan Make Up Professional", "NOWGENN Cosmetics Pvt Ltd",
      "Ratheesh Rajan".

      `sameAs` carries only profiles confirmed by the business — a wrong one
      links the entity to an account that is not the brand's, which is worse
      than listing nothing. Both below are confirmed.

      Both are also stored as canonical profile URLs, not as the share links
      they were supplied as. Facebook in particular hands out
      `/share/<opaque-id>/`, which is a redirect it owns and can retire; putting
      that in an entity graph points Google at a URL whose destination we do not
      control. It was resolved once, here, and the endpoint recorded instead.

      This list and the anchors in `Footer.tsx` must stay in step, so that the
      site and the entity graph never disagree about which accounts are ours.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Chullan Make Up Professional",
        "alternateName": "Chullan",
        "legalName": "NOWGENN Cosmetics Pvt Ltd",
        "url": "https://chullancosmetics.com",
        "logo": "https://chullancosmetics.com/favicon.svg",
        "description": "Professional base makeup formulated in the USA and manufactured in India, built for Indian skin tones and Indian conditions.",
        "foundingLocation": "India",
        "sameAs": [
          "https://www.instagram.com/chullanmakeup_cosmetics",
          "https://www.facebook.com/chullancosmetics"
        ],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Site No. 35, K. No. 35/35, Balaji Layout, Sathanur",
          "addressLocality": "Bengaluru",
          "addressRegion": "Karnataka",
          "postalCode": "562149",
          "addressCountry": "IN"
        },
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "name": "Ratheesh Rajan",
          "telephone": "+91-95267-46656",
          "areaServed": "IN",
          "availableLanguage": ["en"]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
