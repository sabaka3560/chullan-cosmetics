<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    CHULLAN mark.

    The brand device is the wordmark set inside a hard-cornered box — it is on
    the nav, and on every pack in the 2026 catalogue. A wordmark is illegible at
    16px, so this keeps the box and reduces the type to its initial.

    Deliberately monochrome. The palette has no accent colour anywhere, and a
    favicon is the wrong place to invent one.

    The black ground is doing real work: it gives the mark its own contrast so it
    stays readable whether the browser paints a light or a dark tab strip. An
    outline-only version disappears against one of them.

    Square corners, no radius, matching `border-radius: 0` throughout the design.
  -->
  <rect width="100" height="100" fill="#0b0b0b"/>

  <!--
    The C as a stroked arc rather than text: no font to load, no fallback to go
    wrong, and it stays exact at every size.

    Butt caps, not round — the terminals read as cut, which is the same
    architectural edge the rest of the identity has.
  -->
  <path
    d="M 67.4 29.3 A 27 27 0 1 0 67.4 70.7"
    fill="none"
    stroke="#f3f1ed"
    stroke-width="14"
    stroke-linecap="butt"
  />
</svg>
